[package]
name = "palladium"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A fast, sound, dependency-free Lean 4 kernel"

[lib]
name = "palladium"
path = "src/lib.rs"

[[bin]]
name = "palladium"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

[profile.dev]
opt-level = 1
